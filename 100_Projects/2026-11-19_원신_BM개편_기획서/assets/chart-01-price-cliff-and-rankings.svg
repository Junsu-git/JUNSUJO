  <text x="1160" y="54" fill="#94A3B8" font-size="12" text-anchor="end">출처: 모바일인덱스 통합 시계열 마스터 DB (2026.09.03 ~ 10.29) / 인게임 상점 실측</text>
  <line x1="40" y1="102" x2="1160" y2="102" stroke="#334155" stroke-width="1"/>

